<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>監考查詢系統</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --standby-color: #f39c12; 
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 15px;
            color: var(--text-color);
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 20px;
        }

        .control-panel {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 15px;
            color: var(--primary-color);
        }

        select, input[type="date"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #fcfcfc;
            outline: none;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 15px;
            border-left: 5px solid var(--secondary-color);
        }

        .card-header {
            background: #ecf0f1;
            padding: 12px 15px;
            font-weight: bold;
            font-size: 16px;
            color: var(--primary-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card.standby {
            border-left: 5px solid var(--standby-color);
        }
        
        .card.standby .card-header {
            background: #fdf3e7;
            color: #d35400;
        }

        .card-body {
            padding: 15px;
            font-size: 15px;
            line-height: 1.6;
        }

        .card-body p { margin: 4px 0; }

        .tag {
            background: var(--secondary-color);
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .tag.standby-tag { background: var(--standby-color); }

        .empty-state {
            text-align: center;
            padding: 30px 15px;
            color: #7f8c8d;
            background: var(--card-bg);
            border-radius: 12px;
        }

        .error-state {
            color: #e74c3c;
            background: #fadbd8;
            padding: 20px;
            border-radius: 12px;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            font-weight: bold;
            color: var(--secondary-color);
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 監考查詢系統</h1>

    <div class="control-panel">
        <div class="form-group">
            <label for="teacherSelect">👨‍🏫 選擇監考老師：</label>
            <select id="teacherSelect">
                <option value="">請選擇老師編號 / 姓名</option>
            </select>
        </div>
        <div class="form-group">
            <label for="dateSelect">📅 選擇日期：</label>
            <input type="date" id="dateSelect">
        </div>
    </div>

    <div id="results">
        <div class="loading">正在載入數據，請稍候...</div>
    </div>
</div>

<script>
    let examData = [];

    function formatDateStr(dateObj) {
        const yyyy = dateObj.getFullYear();
        const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
        const dd = String(dateObj.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
    }

    function normalizeExcelDate(excelDate) {
        if (!excelDate) return "";
        const strDate = String(excelDate).trim(); // 強制轉字串防 Crash
        if (strDate.match(/^\d{4}-\d{2}-\d{2}$/)) return strDate;
        try {
            const d = new Date(strDate);
            if (!isNaN(d.getTime())) return formatDateStr(d);
            return strDate; 
        } catch (e) {
            return strDate;
        }
    }

    async function init() {
        try {
            // 使用 encodeURI 確保中文檔名在手機上不會變成亂碼導致 404
            const fileUrl = encodeURI('監考總表.xlsx');
            const response = await fetch(fileUrl + '?t=' + new Date().getTime()); // 加上時間戳強制破解快取
            
            if (!response.ok) {
                throw new Error(`找不到檔案 (HTTP 狀態碼: ${response.status})。請確定 GitHub 上有上傳名為「監考總表.xlsx」的檔案。`);
            }
            
            const arrayBuffer = await response.arrayBuffer();
            const workbook = XLSX.read(arrayBuffer, { type: 'array', cellDates: true });
            
            // 尋找包含「每個老師」的工作表
            let targetSheetName = workbook.SheetNames.find(name => name.includes("每個老師")) || workbook.SheetNames[0];
            const sheet = workbook.Sheets[targetSheetName];
            
            let rawData = XLSX.utils.sheet_to_json(sheet, { raw: false, dateNF: 'yyyy-mm-dd' });

            if (rawData.length === 0) {
                throw new Error("工作表內沒有資料，請檢查 Excel 內容。");
            }

            // 安全向下填補老師名稱
            let lastTeacher = "";
            rawData.forEach(row => {
                if (row['監考老師'] !== undefined && String(row['監考老師']).trim() !== "") {
                    lastTeacher = String(row['監考老師']).trim();
                } else {
                    row['監考老師'] = lastTeacher;
                }
            });

            examData = rawData;
            setupUI();

        } catch (error) {
            console.error(error);
            document.getElementById('results').innerHTML = `
                <div class="error-state">
                    ❌ 系統發生錯誤<br><br>
                    <span style="font-size:14px; font-weight:normal;">${error.message}</span>
                </div>
            `;
        }
    }

    function setupUI() {
        const teacherSet = new Set();
        examData.forEach(row => {
            let teacher = row['監考老師'];
            if (teacher) teacherSet.add(String(teacher).trim());
        });
        const teachers = Array.from(teacherSet).sort();

        // 如果讀不到半個老師，代表 Excel 表頭抓錯了
        if (teachers.length === 0) {
            document.getElementById('results').innerHTML = `
                <div class="error-state">
                    ❌ 找不到老師名單<br>
                    <span style="font-size:14px; font-weight:normal;">請確認 Excel 中的第一列標題是否包含「監考老師」欄位。</span>
                </div>
            `;
            return;
        }

        const teacherSelect = document.getElementById('teacherSelect');
        teachers.forEach(t => {
            const option = document.createElement('option');
            option.value = t;
            option.textContent = t;
            teacherSelect.appendChild(option);
        });

        const today = new Date();
        const dateSelect = document.getElementById('dateSelect');
        dateSelect.value = formatDateStr(today);

        teacherSelect.addEventListener('change', renderResults);
        dateSelect.addEventListener('change', renderResults);

        renderResults();
    }

    function renderResults() {
        const selectedTeacher = document.getElementById('teacherSelect').value;
        const selectedDate = document.getElementById('dateSelect').value;
        const resultsContainer = document.getElementById('results');

        if (!selectedTeacher) {
            resultsContainer.innerHTML = `
                <div class="empty-state">
                    ☝️ 請從上方選單選擇您的 <b>老師編號</b> 來查看監考時間表
                </div>`;
            return;
        }

        const filteredData = examData.filter(row => {
            const tName = row['監考老師'] ? String(row['監考老師']).trim() : '';
            const rawDate = row['日期'] ? String(row['日期']).trim() : '';
            const normalizedDate = normalizeExcelDate(rawDate);
            return (tName === selectedTeacher) && (normalizedDate === selectedDate);
        });

        if (filteredData.length === 0) {
            resultsContainer.innerHTML = `
                <div class="empty-state">
                    ✅ <b>${selectedDate}</b> 當天沒有您的監考任務紀錄。
                </div>`;
            return;
        }

        let htmlContent = '';
        filteredData.forEach(item => {
            // 安全讀取字串，防止當機
            const role = item['崗位'] ? String(item['崗位']) : '';
            const rawSubject = item['科目'] ? String(item['科目']) : '';
            
            const isStandby = role.includes('後備') || role.toUpperCase().includes('STANDBY') || rawSubject.includes('後備');

            const startTime = item['到場'] || '';
            const endTime = item['結束'] || '';
            const timeStr = (startTime && endTime) ? `${startTime} - ${endTime}` : (startTime || endTime || (isStandby ? '全日 / 待通知' : '特殊時段'));
            
            const subject = rawSubject || (isStandby ? '隨時候命 (Standby)' : '不適用');
            const location = item['地點'] || (isStandby ? '校務處 / 未指派' : '未指派');
            const gradeClass = [item['級號'], item['班/組別']].filter(Boolean).join(' - ') || (isStandby ? 'N/A' : 'N/A');
            const displayRole = role || (isStandby ? '後備' : '監考員');

            if (isStandby) {
                htmlContent += `
                    <div class="card standby">
                        <div class="card-header">
                            <span>🕒 ${timeStr}</span>
                            <span class="tag standby-tag">⚠️ ${displayRole}</span>
                        </div>
                        <div class="card-body">
                            <p><strong>📍 地點：</strong> ${location}</p>
                            <p><strong>📚 任務：</strong> ${subject}</p>
                            <p style="color: #e67e22; font-size: 13px; margin-top: 8px;">💡 當日為後備當值，請留意校方最新代課安排。</p>
                        </div>
                    </div>
                `;
            } else {
                htmlContent += `
                    <div class="card">
                        <div class="card-header">
                            <span>🕒 ${timeStr}</span>
                            <span class="tag">${displayRole}</span>
                        </div>
                        <div class="card-body">
                            <p><strong>📍 地點：</strong> ${location}</p>
                            <p><strong>📚 科目：</strong> ${subject}</p>
                            <p><strong>👥 級別：</strong> ${gradeClass}</p>
                        </div>
                    </div>
                `;
            }
        });

        resultsContainer.innerHTML = htmlContent;
    }

    window.onload = init;
</script>

</body>
</html>
