<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>監考查詢系統</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 15px;
            color: var(--text-color);
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 20px;
        }

        .control-panel {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 15px;
            color: var(--primary-color);
        }

        select, input[type="date"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #fcfcfc;
            outline: none;
        }

        select:focus, input[type="date"]:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 15px;
            border-left: 5px solid var(--secondary-color);
        }

        .card-header {
            background: #ecf0f1;
            padding: 12px 15px;
            font-weight: bold;
            font-size: 16px;
            color: var(--primary-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-body {
            padding: 15px;
            font-size: 15px;
            line-height: 1.6;
        }

        .card-body p {
            margin: 4px 0;
        }

        .tag {
            background: var(--secondary-color);
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: normal;
        }

        .empty-state {
            text-align: center;
            padding: 30px 15px;
            color: #7f8c8d;
            background: var(--card-bg);
            border-radius: 12px;
        }

        .loading {
            text-align: center;
            font-weight: bold;
            color: var(--secondary-color);
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 監考查詢系統</h1>

    <div class="control-panel">
        <div class="form-group">
            <label for="teacherSelect">👨‍🏫 選擇監考老師：</label>
            <select id="teacherSelect">
                <option value="">請選擇老師編號 / 姓名</option>
            </select>
        </div>
        <div class="form-group">
            <label for="dateSelect">📅 選擇日期：</label>
            <input type="date" id="dateSelect">
        </div>
    </div>

    <div id="results">
        <div class="loading">正在載入「監考總表.xlsx」數據...</div>
    </div>
</div>

<script>
    let examData = [];

    // 格式化日期：確保回傳 YYYY-MM-DD 格式
    function formatDateStr(dateObj) {
        const yyyy = dateObj.getFullYear();
        const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
        const dd = String(dateObj.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
    }

    // 將 Excel 的文字日期正規化成 YYYY-MM-DD 進行比對
    function normalizeExcelDate(excelDate) {
        if (!excelDate) return "";
        // 若已經是 YYYY-MM-DD
        if (excelDate.match(/^\d{4}-\d{2}-\d{2}$/)) return excelDate;
        
        try {
            const d = new Date(excelDate);
            if (!isNaN(d.getTime())) {
                return formatDateStr(d);
            }
            return excelDate; 
        } catch (e) {
            return excelDate;
        }
    }

    // 初始化應用
    async function init() {
        try {
            // 從同目錄讀取 Excel 檔案
            const response = await fetch('監考總表.xlsx');
            if (!response.ok) throw new Error("找不到檔案");
            const arrayBuffer = await response.arrayBuffer();
            
            // 解析 Excel
            const workbook = XLSX.read(arrayBuffer, { type: 'array', cellDates: true });
            
            // 自動尋找名稱包含「每個老師」的工作表，若無則預設讀取第一個工作表
            let targetSheetName = workbook.SheetNames.find(name => name.includes("每個老師")) || workbook.SheetNames[0];
            const sheet = workbook.Sheets[targetSheetName];
            
            // 轉換為 JSON 陣列 (raw: false 保證取得 Excel 中顯示的格式)
            examData = XLSX.utils.sheet_to_json(sheet, { raw: false, dateNF: 'yyyy-mm-dd' });

            setupUI();
        } catch (error) {
            console.error(error);
            document.getElementById('results').innerHTML = `
                <div class="empty-state">
                    <p style="color: #e74c3c; font-weight:bold;">❌ 讀取資料失敗</p>
                    <p style="font-size: 14px;">請確定 GitHub 儲存庫內含有 <b>監考總表.xlsx</b> 檔案，且網路連線正常。</p>
                </div>
            `;
        }
    }

    // 建立 UI 控制項
    function setupUI() {
        // 1. 取得所有不重複的老師編號/名稱，並排序
        const teacherSet = new Set();
        examData.forEach(row => {
            let teacher = row['監考老師'];
            if (teacher) teacherSet.add(String(teacher).trim());
        });
        const teachers = Array.from(teacherSet).sort();

        // 2. 寫入下拉選單
        const teacherSelect = document.getElementById('teacherSelect');
        teachers.forEach(t => {
            const option = document.createElement('option');
            option.value = t;
            option.textContent = t;
            teacherSelect.appendChild(option);
        });

        // 3. 預設日期為「今天」
        const today = new Date();
        const dateSelect = document.getElementById('dateSelect');
        dateSelect.value = formatDateStr(today);

        // 4. 綁定事件：當選單或日期改變時觸發篩選
        teacherSelect.addEventListener('change', renderResults);
        dateSelect.addEventListener('change', renderResults);

        // 初始狀態清除 Loading 顯示
        renderResults();
    }

    // 渲染搜尋結果
    function renderResults() {
        const selectedTeacher = document.getElementById('teacherSelect').value;
        const selectedDate = document.getElementById('dateSelect').value;
        const resultsContainer = document.getElementById('results');

        if (!selectedTeacher) {
            resultsContainer.innerHTML = `
                <div class="empty-state">
                    ☝️ 請從上方選單選擇您的 <b>老師編號</b> 來查看監考時間表
                </div>`;
            return;
        }

        // 過濾資料
        const filteredData = examData.filter(row => {
            const tName = row['監考老師'] ? String(row['監考老師']).trim() : '';
            const rawDate = row['日期'] ? String(row['日期']).trim() : '';
            const normalizedDate = normalizeExcelDate(rawDate);
            
            // 比對老師與日期
            return (tName === selectedTeacher) && (normalizedDate === selectedDate);
        });

        // 生成 HTML
        if (filteredData.length === 0) {
            resultsContainer.innerHTML = `
                <div class="empty-state">
                    ✅ <b>${selectedDate}</b> 當天沒有您的監考任務紀錄。
                </div>`;
            return;
        }

        let htmlContent = '';
        filteredData.forEach(item => {
            // 讀取各項數據，若無資料則為空字串或預設備註
            const startTime = item['到場'] || '';
            const endTime = item['結束'] || '';
            const timeStr = (startTime && endTime) ? `${startTime} - ${endTime}` : (startTime || endTime || '特殊時段/後備');
            
            const subject = item['科目'] || '不適用';
            const location = item['地點'] || '未指派';
            const gradeClass = [item['級號'], item['班/組別']].filter(Boolean).join(' - ') || 'N/A';
            const role = item['崗位'] || '監考員';

            htmlContent += `
                <div class="card">
                    <div class="card-header">
                        <span>🕒 ${timeStr}</span>
                        <span class="tag">${role}</span>
                    </div>
                    <div class="card-body">
                        <p><strong>📍 地點：</strong> ${location}</p>
                        <p><strong>📚 科目：</strong> ${subject}</p>
                        <p><strong>👥 級別：</strong> ${gradeClass}</p>
                    </div>
                </div>
            `;
        });

        resultsContainer.innerHTML = htmlContent;
    }

    // 啟動程式
    window.onload = init;
</script>

</body>
</html>
