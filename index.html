<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>監考查詢系統</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { 
            --primary-color: #2c3e50; 
            --secondary-color: #3498db; 
            --standby-color: #e67e22; 
            --bg-color: #f4f7f6; 
            --card-bg: #ffffff; 
            --text-color: #333333;
        }
        body { font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif; background-color: var(--bg-color); margin: 0; padding: 15px; color: var(--text-color); }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { text-align: center; color: var(--primary-color); font-size: 24px; margin-bottom: 20px; }
        .control-panel { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group:last-child { margin-bottom: 0; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 15px; color: var(--primary-color); }
        select, input[type="date"] { width: 100%; padding: 12px; border: 1px solid #dcdde1; border-radius: 8px; font-size: 16px; box-sizing: border-box; background-color: #fcfcfc; outline: none; }
        select:focus, input[type="date"]:focus { border-color: var(--secondary-color); box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2); }
        .card { background: var(--card-bg); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; border-left: 5px solid var(--secondary-color); }
        .card.standby { border-left: 5px solid var(--standby-color); }
        .card-header { background: #ecf0f1; padding: 12px 15px; font-weight: bold; font-size: 16px; color: var(--primary-color); display: flex; justify-content: space-between; align-items: center; }
        .card.standby .card-header { background: #fdf3e7; color: #d35400; }
        .card-body { padding: 15px; font-size: 15px; line-height: 1.6; }
        .card-body p { margin: 6px 0; border-bottom: 1px dashed #eee; padding-bottom: 6px; }
        .card-body p:last-child { border-bottom: none; padding-bottom: 0; }
        .tag { background: var(--secondary-color); color: white; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: normal; }
        .tag.standby-tag { background: var(--standby-color); }
        .empty-state { text-align: center; padding: 30px 15px; color: #7f8c8d; background: var(--card-bg); border-radius: 12px; }
        .error-state { color: #e74c3c; background: #fadbd8; padding: 20px; border-radius: 12px; font-weight: bold; }
        .loading { text-align: center; font-weight: bold; color: var(--secondary-color); padding: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 監考查詢系統</h1>
        <div class="control-panel">
            <div class="form-group">
                <label for="teacherSelect">👨‍🏫 選擇監考老師：</label>
                <select id="teacherSelect"></select>
            </div>
            <div class="form-group">
                <label for="dateSelect">📅 選擇日期：</label>
                <input type="date" id="dateSelect">
            </div>
        </div>
        <div id="results"><div class="loading">正在載入數據，請稍候...</div></div>
    </div>

    <script>
        let examData = [];

        function getTodayStr() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        function normalizeExcelDate(excelDate) {
            if (!excelDate) return "";
            const strDate = String(excelDate).trim();
            if (strDate.match(/^\d{4}-\d{2}-\d{2}$/)) return strDate;
            try {
                const d = new Date(strDate);
                if (!isNaN(d.getTime())) {
                    const y = d.getFullYear();
                    const m = String(d.getMonth() + 1).padStart(2, '0');
                    const day = String(d.getDate()).padStart(2, '0');
                    return `${y}-${m}-${day}`;
                }
                return strDate; 
            } catch (e) {
                return strDate;
            }
        }

        async function init() {
            try {
                const response = await fetch('exam.xlsx?t=' + new Date().getTime());
                if (!response.ok) throw new Error(`找不到檔案 (HTTP ${response.status})，請確認儲存庫內有名為 exam.xlsx 的檔案。`);
                
                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                const sheet = workbook.Sheets["每個老師監考表"] || workbook.Sheets[workbook.SheetNames[0]];
                let rawData = XLSX.utils.sheet_to_json(sheet, { raw: false });

                if (rawData.length === 0) throw new Error("工作表內沒有找到任何數據。");

                // 自動填補空白的老師編號 (解決後備欄位留空問題)
                let lastTeacher = "";
                rawData.forEach(row => {
                    if (row['監考老師'] !== undefined && String(row['監考老師']).trim() !== "") {
                        lastTeacher = String(row['監考老師']).trim();
                    } else if (lastTeacher !== "") {
                        row['監考老師'] = lastTeacher;
                    }
                });

                examData = rawData;
                setupUI();
            } catch (err) {
                document.getElementById('results').innerHTML = `<div class="error-state">❌ 系統載入失敗<br><span style="font-size:14px; font-weight:normal;">${err.message}</span></div>`;
            }
        }

        function setupUI() {
            const teacherSet = new Set();
            examData.forEach(row => {
                if (row['監考老師']) teacherSet.add(String(row['監考老師']).trim());
            });

            // 按純數字順序對老師編號進行智慧排序
            const teachers = Array.from(teacherSet).sort((a, b) => {
                return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
            });

            const select = document.getElementById('teacherSelect');
            select.innerHTML = '';
            teachers.forEach(t => {
                const option = document.createElement('option');
                option.value = t;
                option.textContent = t;
                select.appendChild(option);
            });

            // 預設鎖定選取 218 號老師
            if (teacherSet.has("218")) {
                select.value = "218";
            }

            // 動態自動預設為當天日期
            document.getElementById('dateSelect').value = getTodayStr();

            select.onchange = renderResults;
            document.getElementById('dateSelect').onchange = renderResults;

            renderResults();
        }

        function renderResults() {
            const selectedTeacher = document.getElementById('teacherSelect').value;
            const
