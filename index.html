<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>監考查詢系統</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --standby-color: #e67e22; 
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 15px;
            color: var(--text-color);
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 20px;
        }

        .control-panel {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 15px;
            color: var(--primary-color);
        }

        select, input[type="date"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #fcfcfc;
            outline: none;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 15px;
            border-left: 5px solid var(--secondary-color);
        }

        .card-header {
            background: #ecf0f1;
            padding: 12px 15px;
            font-weight: bold;
            font-size: 16px;
            color: var(--primary-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card.standby {
            border-left: 5px solid var(--standby-color);
        }

        .card-body {
            padding: 15px;
            font-size: 15px;
            line-height: 1.6;
        }

        .card-body p { 
            margin: 6px 0; 
            border-bottom: 1px dashed #eee;
            padding-bottom: 6px;
        }

        .card-body p:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .tag {
            background: var(--secondary-color);
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .tag.standby-tag { background: var(--standby-color); }

        .empty-state {
            text-align: center;
            padding: 30px 15px;
            color: #7f8c8d;
            background: var(--card-bg);
            border-radius: 12px;
        }

        .error-state {
            color: #e74c3c;
            background: #fadbd8;
            padding: 20px;
            border-radius: 12px;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            font-weight: bold;
            color: var(--secondary-color);
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 監考查詢系統</h1>

    <div class="control-panel">
        <div class="form-group">
            <label for="teacherSelect">👨‍🏫 選擇監考老師：</label>
            <select id="teacherSelect">
                <option value="">請選擇老師編號 / 姓名</option>
            </select>
        </div>
        <div class="form-group">
            <label for="dateSelect">📅 選擇日期：</label>
            <input type="date" id="dateSelect">
        </div>
    </div>

    <div id="results">
        <div class="loading">正在載入數據，請稍候...</div>
    </div>
</div>
